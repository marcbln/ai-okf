[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-okf"
version = "0.1.0"
description = "OKF knowledge base agent — explore codebases and generate structured knowledge bundles"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Developer", email = "dev@example.com" },
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic-ai>=2.5.0",
    "gitpython>=3.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
okf = "ai_okf.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
strict = true

[tool.black]
line-length = 88
